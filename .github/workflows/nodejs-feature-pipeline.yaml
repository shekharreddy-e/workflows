name: nodejs-feature-branch-workflow
on: 

# someone should call this
  workflow_call:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string
      component:
        description: 'Component name'
        required: true
        type: string
env:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}
  acc_id: 764694154057
     
jobs:
  trigger:
    runs-on: self-hosted
    steps:
      - name: checkout or clone code
        uses: actions/checkout@v6

      - name: Read package.json version
        id: package-version
        run: |
          APP_VERSION=$(jq -r '.version' package.json)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          
      - name: check app version
        run: echo "$APP_VERSION"

      - name: install dependencies
        run: npm install

      - name: unit tests
        id: unit_tests
        run: npm test


      - name: sonar scan
        id: sonar_scan
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: sonar_check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }} 

      - name: Check Dependabot Alerts
        id: library_scan
        uses: Posture-Cybersecurity/dependabot-security-checker@v1.1.5
        with:
          github-token: ${{ secrets.DEPENDABOT_TOKEN }}  
          severities: 'critical,high' 
          output-file: 'security-report.csv'
          fail-on-alerts: 'true'  

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image 
        id: build_image
        run: docker build -t  ${acc_id}.dkr.ecr.us-east-1.amazonaws.com/${project}/${component}:${APP_VERSION} .